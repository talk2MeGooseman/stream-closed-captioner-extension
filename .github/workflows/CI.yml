name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn lint

      - name: Run tests
        run: yarn test

      # Build exactly what gets uploaded to Twitch and fail on anything their
      # review or hosted CSP would reject (inline scripts, eval, external
      # scripts, non-asset files). See scripts/check-bundle.mjs.
      - name: Build
        run: yarn build

      - name: Check bundle against Twitch Extension rules
        run: yarn check:bundle
