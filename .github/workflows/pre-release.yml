name: "pre-release"

on:
  push:
    branches:
      - "main"

permissions:
  contents: write

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-release:
    name: "Pre Release"
    runs-on: "ubuntu-latest"
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      - name: Check bundle against Twitch Extension rules
        run: yarn check:bundle

      # release.zip is the Twitch "version assets" upload: files at the ZIP
      # root, nothing but the assets the Extension needs to run.
      - name: Package Twitch version assets
        run: |
          cd dist
          zip -r ../release.zip .

      # Twitch reviewers need human-readable code. The shipped JS is minified,
      # so attach the source alongside it (tracked files only, no node_modules).
      - name: Package source for review
        run: git archive --format=zip --output=source.zip HEAD

      - name: Publish development build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest release.zip source.zip \
            --prerelease \
            --title "Development Build" \
            --target "$GITHUB_SHA" \
            --notes "Development build of $GITHUB_SHA. release.zip is the Twitch version-assets upload; source.zip is the readable source for Twitch review."
