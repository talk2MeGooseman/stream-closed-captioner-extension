name: "pre-release"

on:
  push:
    branches:
      - "main"

permissions:
  contents: write

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-release:
    name: "Pre Release"
    runs-on: "ubuntu-latest"
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      - name: Check bundle against Twitch Extension rules
        run: yarn check:bundle

      # release.zip is the Twitch "version assets" upload: files at the ZIP
      # root, nothing but the assets the Extension needs to run.
      - name: Package Twitch version assets
        run: |
          cd dist
          zip -r ../release.zip .

      # Twitch reviewers need human-readable code. The shipped JS is minified,
      # so attach the source alongside it (tracked files only, no node_modules).
      - name: Package source for review
        run: git archive --format=zip --output=source.zip HEAD

      # The notes list every merged PR since the latest full (non-pre-release)
      # release, so they can be copied into the next release / Twitch change
      # log as-is. GitHub builds them from the API, so the shallow checkout is
      # fine. Grouping lives in .github/release.yml.
      - name: Publish development build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # releases/latest skips pre-releases and drafts. It 404s when there
          # is no full release yet (gh then prints the error body, so drop it).
          if ! last_release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null); then
            last_release=""
          fi

          header="Development build of $GITHUB_SHA. \`release.zip\` is the Twitch version-assets upload; \`source.zip\` is the readable source for Twitch review."
          if [ -n "$last_release" ]; then
            header+=$'\n\n'"Changes since [$last_release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$last_release):"
          else
            header+=$'\n\n'"No full release yet, so this lists every change."
          fi

          start_tag=()
          if [ -n "$last_release" ]; then
            start_tag=(--notes-start-tag "$last_release")
          fi

          gh release delete latest --yes --cleanup-tag || true
          gh release create latest release.zip source.zip \
            --prerelease \
            --title "Development Build" \
            --target "$GITHUB_SHA" \
            --notes "$header" \
            --generate-notes \
            "${start_tag[@]}"
