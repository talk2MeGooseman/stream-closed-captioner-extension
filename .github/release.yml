# Groups the auto-generated release notes (the Development Build pre-release
# and "Generate release notes" in the GitHub UI). Dependabot PRs carry the
# "dependencies" label, so they're collected at the bottom instead of burying
# the real changes.
changelog:
  categories:
    - title: Changes
      labels:
        - "*"
      exclude:
        labels:
          - dependencies
    - title: Dependency updates
      labels:
        - dependencies
